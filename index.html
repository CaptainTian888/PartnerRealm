<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>稳链同创 | 合作伙伴管理平台</title>
<meta name="description" content="稳链同创 — 合作伙伴管理平台，统一管理伙伴档案、项目周期、签约记录与资金往来。">
<meta name="theme-color" content="#0b1f3a">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/portal.css">
</head>
<body class="portal">

<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header" id="siteHeader">
  <div class="container site-header__inner">
    <a class="brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">稳</span>
      <span class="brand__text">
        <strong data-bind="brand.name">稳链同创</strong>
        <em data-bind="brand.tagline">稳固供应链 · 同创新价值</em>
      </span>
    </a>

    <nav class="site-nav" id="siteNav" aria-label="主导航">
      <a href="#about">关于我们</a>
      <a href="#capabilities">业务板块</a>
      <a href="#partners">合作伙伴</a>
      <a href="#projects">项目进展</a>
      <a href="#contact">联系我们</a>
    </nav>

    <div class="site-header__actions">
      <a class="btn btn--primary btn--sm" href="admin.html">管理后台</a>
      <button class="nav-toggle" id="navToggle" aria-label="展开导航" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <section class="hero">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="container hero__inner">
      <p class="hero__eyebrow" data-bind="hero.eyebrow"></p>
      <h1 class="hero__title" data-bind="hero.title"></h1>
      <p class="hero__subtitle" data-bind="hero.subtitle"></p>
      <div class="hero__actions">
        <a class="btn btn--primary" id="heroPrimary" href="admin.html"></a>
        <a class="btn btn--ghost" id="heroSecondary" href="#about"></a>
      </div>
      <ul class="hero__stats" id="heroStats"></ul>
    </div>
  </section>

  <section class="section" id="about">
    <div class="container">
      <header class="section__head">
        <h2 class="section__title" data-bind="about.title"></h2>
        <p class="section__subtitle" data-bind="about.subtitle"></p>
      </header>
      <div class="about">
        <div class="about__text" id="aboutText"></div>
        <ul class="about__highlights" id="aboutHighlights"></ul>
      </div>
    </div>
  </section>

  <section class="section section--alt" id="capabilities">
    <div class="container">
      <header class="section__head">
        <h2 class="section__title" data-bind="capabilities.title"></h2>
        <p class="section__subtitle" data-bind="capabilities.subtitle"></p>
      </header>
      <ul class="cap-grid" id="capGrid"></ul>
    </div>
  </section>

  <section class="section" id="partners">
    <div class="container">
      <header class="section__head">
        <h2 class="section__title">合作伙伴</h2>
        <p class="section__subtitle">与我们保持长期协作的核心伙伴</p>
      </header>
      <ul class="partner-grid" id="partnerGrid"></ul>
    </div>
  </section>

  <section class="section section--alt" id="projects">
    <div class="container">
      <header class="section__head">
        <h2 class="section__title">项目进展</h2>
        <p class="section__subtitle">正在推进中的合作项目与所处阶段</p>
      </header>
      <ul class="project-list" id="projectList"></ul>
    </div>
  </section>

  <section class="section section--contact" id="contact">
    <div class="container">
      <div class="contact-card">
        <div class="contact-card__text">
          <h2 data-bind="contact.title"></h2>
          <p data-bind="contact.subtitle"></p>
        </div>
        <ul class="contact-card__list" id="contactList"></ul>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <p data-bind="footer.copyright"></p>
    <p class="site-footer__links">
      <a href="admin.html">管理后台</a>
      <span data-bind="footer.icp"></span>
    </p>
  </div>
</footer>

<script type="module" src="assets/js/portal.js"></script>
</body>
</html>
