<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理后台 | 稳链同创</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">

<!-- 口令入口 -->
<div class="gate" id="gate" hidden>
  <form class="gate__card" id="gateForm" autocomplete="off">
    <span class="gate__mark" aria-hidden="true">稳</span>
    <h1>稳链同创 · 管理后台</h1>
    <p class="gate__hint">请输入管理口令</p>
    <label class="gate__field">
      <span class="sr-only">管理口令</span>
      <input type="password" id="gatePassword" placeholder="管理口令" required autocomplete="current-password">
    </label>
    <p class="gate__error" id="gateError" role="alert" hidden></p>
    <button class="btn btn--primary btn--block" type="submit">进入后台</button>
    <a class="gate__back" href="index.html">← 返回门户首页</a>
  </form>
</div>

<!-- 后台主体 -->
<div class="shell" id="shell" hidden>

  <aside class="sidebar" id="sidebar">
    <a class="sidebar__brand" href="index.html">
      <span class="brand__mark" aria-hidden="true">稳</span>
      <span><strong>稳链同创</strong><em>管理后台</em></span>
    </a>

    <nav class="sidebar__nav" aria-label="后台导航">
      <a href="#/dashboard" data-view="dashboard"><i aria-hidden="true">▦</i>总览看板</a>
      <a href="#/partners" data-view="partners"><i aria-hidden="true">◈</i>合作伙伴</a>
      <a href="#/projects" data-view="projects"><i aria-hidden="true">◆</i>项目管理</a>
      <a href="#/contracts" data-view="contracts"><i aria-hidden="true">▤</i>签约管理</a>
      <a href="#/finance" data-view="finance"><i aria-hidden="true">₵</i>资金往来</a>
      <a href="#/org" data-view="org"><i aria-hidden="true">⌗</i>公司架构</a>
      <a href="#/site" data-view="site"><i aria-hidden="true">◑</i>门户内容</a>
      <a href="#/deploy" data-view="deploy"><i aria-hidden="true">↑</i>发布部署</a>
    </nav>

    <div class="sidebar__foot">
      <a class="sidebar__link" href="index.html" target="_blank" rel="noopener">查看门户 ↗</a>
      <button class="sidebar__link" id="logoutBtn" type="button">退出登录</button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button class="topbar__menu" id="menuBtn" type="button" aria-label="展开菜单">☰</button>
      <div class="topbar__title">
        <h1 id="viewTitle">总览看板</h1>
        <p id="viewSubtitle"></p>
      </div>
      <div class="topbar__actions">
        <span class="dirty-badge" id="dirtyBadge" hidden></span>
        <button class="btn btn--ghost btn--sm" id="discardBtn" type="button" hidden>放弃修改</button>
        <button class="btn btn--primary btn--sm" id="deployBtn" type="button">一键部署</button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1">
      <div class="loading">正在加载数据…</div>
    </main>
  </div>
</div>

<div class="modal-host" id="modalHost"></div>

<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
