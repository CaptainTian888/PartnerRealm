<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>稳链投资控股（海南）有限公司 | 稳链同创</title>
<meta name="description" content="稳链投资控股（海南）有限公司 —— 以长期主义经营伙伴关系的产业投资控股平台。">
<meta name="theme-color" content="#0b1f3a">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/portal.css">
</head>
<body class="portal">

<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header" id="siteHeader">
  <div class="container site-header__inner">
    <a class="brand" href="index.html">
      <img class="brand__logo" id="brandLogo" src="assets/img/logo-mark.png" alt="稳链同创" width="40" height="40">
      <span class="brand__text">
        <strong data-bind="brand.name">稳链同创</strong>
        <em data-bind="brand.legalName">稳链投资控股（海南）有限公司</em>
      </span>
    </a>

    <nav class="site-nav" id="siteNav" aria-label="主导航">
      <a href="#about">关于我们</a>
      <a href="#philosophy">经营理念</a>
      <a href="#contact">联系我们</a>
    </nav>

    <div class="site-header__actions">
      <a class="btn btn--primary btn--sm" href="admin.html">管理后台</a>
      <button class="nav-toggle" id="navToggle" aria-label="展开导航" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main id="main">

  <section class="hero">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="container hero__inner">
      <img class="hero__logo" id="heroLogo" src="assets/img/logo-mark.png" alt="" width="256" height="256" aria-hidden="true">
      <p class="hero__eyebrow" data-bind="hero.eyebrow"></p>
      <h1 class="hero__title" data-bind="hero.title"></h1>
      <p class="hero__subtitle" data-bind="hero.subtitle"></p>
      <div class="hero__actions">
        <a class="btn btn--primary" id="heroPrimary" href="#philosophy"></a>
        <a class="btn btn--ghost" id="heroSecondary" href="#contact"></a>
      </div>
      <ul class="hero__stats" id="heroStats"></ul>
    </div>
  </section>

  <section class="section" id="about">
    <div class="container">
      <header class="section__head">
        <h2 class="section__title" data-bind="about.title"></h2>
        <p class="section__subtitle" data-bind="about.subtitle"></p>
      </header>
      <div class="about">
        <div class="about__text" id="aboutText"></div>
        <ul class="about__highlights" id="aboutHighlights"></ul>
      </div>
    </div>
  </section>

  <section class="section section--philosophy" id="philosophy">
    <div class="container">
      <header class="section__head">
        <h2 class="section__title" data-bind="philosophy.title"></h2>
        <p class="section__subtitle" data-bind="philosophy.subtitle"></p>
      </header>
      <ul class="creed" id="creedList"></ul>
      <blockquote class="creed__statement" id="creedStatement"></blockquote>
    </div>
  </section>

  <section class="section section--contact" id="contact">
    <div class="container">
      <div class="contact-card">
        <div class="contact-card__text">
          <h2 data-bind="contact.title"></h2>
          <p data-bind="contact.subtitle"></p>
        </div>
        <ul class="contact-card__list" id="contactList"></ul>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <img src="assets/img/logo-mark.png" alt="" width="32" height="32" aria-hidden="true">
      <span data-bind="brand.legalName"></span>
    </div>
    <p data-bind="footer.copyright"></p>
    <p class="site-footer__links">
      <a href="admin.html">管理后台</a>
      <span data-bind="footer.icp"></span>
    </p>
  </div>
</footer>

<script type="module" src="assets/js/portal.js"></script>
</body>
</html>
